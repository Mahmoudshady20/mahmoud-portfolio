name: Deploy static portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lightweight portfolio (Flutter source is preserved)
        run: python3 build_static.py
      - name: Validate public pages and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path('assets/data/profile.json').read_text())
          root=Path('site')
          assert len(list(root.glob('project-*.html')))==7
          for item in p['projects']:
              assert item['title'] in (root/('project-'+item['slug']+'.html')).read_text()
          assert 'flutter_bootstrap' not in (root/'index.html').read_text()
          for asset in ['site.css','site.js','SpaceGrotesk.ttf','Mahmoud-Shady-Resume.pdf']:
              assert (root/asset).stat().st_size>0
          print('Static content and asset checks passed')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
